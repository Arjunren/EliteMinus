<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Elite Minus</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='11' fill='%23facc15'/><rect x='5.5' y='10' width='13' height='4' rx='2' fill='%230a0a0a'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: {
        brand: { DEFAULT: '#facc15', dark: '#eab308', light: '#fde047' },
        base: { 900: '#000000', 800: '#0f0f0f', 700: '#181818', 600: '#242424', 500: '#2a2a2a' }
      },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
    }}}
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-base-900 text-white font-sans overflow-hidden">
  <script>
    window.CURRENT_USER = { id: {{ user.id }}, name: {{ (user.display_name or user.username) | tojson }} };
  </script>

  <div class="flex h-screen">
    <!-- ===== Admin sidebar ===== -->
    <aside class="w-16 sm:w-60 bg-base-800 border-r border-white/5 flex flex-col shrink-0">
      <div class="flex items-center gap-2 px-4 h-16 border-b border-white/5">
        <svg class="w-8 h-8 text-brand shrink-0" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="currentColor"/><rect x="6.3" y="10.2" width="11.4" height="3.6" rx="1.8" fill="#0a0a0a"/></svg>
        <span class="font-bold hidden sm:inline">Elite<span class="text-brand">Minus-</span> <span class="text-xs text-neutral-500 font-normal">Admin</span></span>
      </div>
      <nav class="flex-1 p-2 space-y-1" id="admin-nav">
        <a href="#/dashboard" data-nav="dashboard" class="anav flex items-center gap-3 px-3 py-2.5 rounded-md text-neutral-300 hover:bg-base-600 font-medium">
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span class="hidden sm:inline">Dashboard</span>
        </a>
        <a href="#/songs" data-nav="songs" class="anav flex items-center gap-3 px-3 py-2.5 rounded-md text-neutral-300 hover:bg-base-600 font-medium">
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg><span class="hidden sm:inline">Songs</span>
        </a>
        <a href="#/artists" data-nav="artists" class="anav flex items-center gap-3 px-3 py-2.5 rounded-md text-neutral-300 hover:bg-base-600 font-medium">
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg><span class="hidden sm:inline">Artists</span>
        </a>
        <a href="#/albums" data-nav="albums" class="anav flex items-center gap-3 px-3 py-2.5 rounded-md text-neutral-300 hover:bg-base-600 font-medium">
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 13a3 3 0 110-6 3 3 0 010 6z"/></svg><span class="hidden sm:inline">Albums</span>
        </a>
        <a href="#/users" data-nav="users" class="anav flex items-center gap-3 px-3 py-2.5 rounded-md text-neutral-300 hover:bg-base-600 font-medium">
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11a4 4 0 10-4-4 4 4 0 004 4zm-8 0a4 4 0 10-4-4 4 4 0 004 4zm0 2c-2.7 0-8 1.3-8 4v3h8v-3c0-1 .4-1.9 1-2.7A11 11 0 008 13zm8 0c-.3 0-.7 0-1.1.1 1.3 1 2.1 2.3 2.1 3.9v3h7v-3c0-2.7-5.3-4-8-4z"/></svg><span class="hidden sm:inline">Users</span>
        </a>
      </nav>
      <a href="/" class="m-2 flex items-center gap-3 px-3 py-2.5 rounded-md text-neutral-300 hover:bg-base-600 font-medium border-t border-white/5">
        <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M10 17l5-5-5-5v3H3v4h7v3zm4-15a2 2 0 012 2v2h-2V4H6v16h8v-2h2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2h8z"/></svg><span class="hidden sm:inline">Open app</span>
      </a>
    </aside>

    <!-- ===== Main ===== -->
    <main class="flex-1 flex flex-col min-w-0">
      <header class="h-16 px-4 sm:px-6 flex items-center justify-between border-b border-white/5 shrink-0">
        <h1 class="text-lg font-bold" id="page-title">Dashboard</h1>
        <div class="flex items-center gap-3">
          <span class="text-sm text-neutral-400 hidden sm:inline">Signed in as <b class="text-white" id="admin-name"></b></span>
          <span class="w-8 h-8 rounded-full bg-brand text-black grid place-items-center font-bold text-sm" id="admin-initial"></span>
          <a href="{{ url_for('auth.logout') }}" class="text-sm font-semibold px-3 py-1.5 rounded-full bg-base-600 hover:bg-base-500">Log out</a>
        </div>
      </header>
      <div id="admin-view" class="flex-1 overflow-y-auto scroll-thin p-4 sm:p-6"></div>
    </main>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] hidden">
    <div class="bg-brand text-black font-semibold text-sm px-4 py-2 rounded-full shadow-lg" id="toast-msg"></div>
  </div>
  <div id="modal-root" class="hidden fixed inset-0 z-[80] bg-black/70 grid place-items-center p-4"></div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
