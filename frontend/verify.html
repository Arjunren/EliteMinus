<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your e-mail · Elite Minus</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='11' fill='%23facc15'/><rect x='5.5' y='10' width='13' height='4' rx='2' fill='%230a0a0a'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      brand: { DEFAULT: '#facc15', dark: '#eab308', light: '#fde047' },
      base: { 900: '#000000', 800: '#121212', 700: '#181818', 600: '#242424' }
    }}}}
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gradient-to-b from-[#1f1f1f] to-black min-h-screen flex items-center justify-center p-4 font-sans text-white">
  <div class="w-full max-w-md bg-base-800 rounded-xl shadow-2xl p-8 sm:p-10">
    <div class="flex items-center justify-center gap-2 mb-8">
      <svg class="w-10 h-10 text-brand" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="currentColor"/><rect x="6.3" y="10.2" width="11.4" height="3.6" rx="1.8" fill="#0a0a0a"/></svg>
      <span class="text-2xl font-bold tracking-tight">Elite<span class="text-brand">Minus-</span></span>
    </div>

    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-brand/15 grid place-items-center">
        <svg class="w-8 h-8 text-brand" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold mb-2">Check your inbox</h1>
      <p class="text-sm text-neutral-400">
        We sent a 6-digit code to<br>
        <b class="text-white" id="verify-email">your e-mail</b>
      </p>
    </div>

    <div id="banner" class="hidden"></div>

    <form id="verify-form" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1">Verification code</label>
        <input name="code" type="text" required inputmode="numeric" pattern="[0-9]*"
               maxlength="6" autocomplete="one-time-code"
               class="otp-input w-full rounded bg-base-600 border border-neutral-700 px-4 py-4 focus:border-white focus:ring-2 focus:ring-white/20 outline-none"
               placeholder="000000">
      </div>
      <button type="submit"
              class="w-full bg-brand hover:bg-brand-dark hover:scale-[1.02] transition rounded-full py-3 font-bold text-black">
        Verify and continue
      </button>
    </form>

    <button id="resend-btn" type="button"
            class="mt-3 w-full rounded-full py-2.5 text-sm font-semibold text-neutral-300 hover:text-white hover:bg-base-600 transition disabled:opacity-50 disabled:hover:bg-transparent">
      Didn't get it? Send a new code
    </button>

    <p class="mt-8 text-center text-sm text-neutral-500 border-t border-neutral-700 pt-6">
      The code expires in 10 minutes. Check your spam folder if it hasn't
      arrived after a minute.
      <a href="register.html" class="block mt-2 text-white underline hover:text-brand">Use a different e-mail</a>
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
